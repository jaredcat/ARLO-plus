name: Update Item Database from Wiki

on:
  # Run weekly on Mondays at 06:00 UTC
  schedule:
    - cron: "0 6 * * 1"
  # Allow manual trigger from GitHub UI
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  # Dispatch CI. A GITHUB_TOKEN push does not start pull_request workflows,
  # and main requires the CI job named "check" before it can merge.
  actions: write

jobs:
  update-db:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      - name: Install scraper dependencies
        run: uv sync --frozen --only-group update-db --no-install-project

      - name: Run wiki scraper (merge mode)
        # Refreshes items/quests + map markers. Basemap PNGs under data/maps/
        # are only re-stitched when data/maps/MANIFEST.json layer signatures
        # no longer match MAP_TILE_CONFIGS (or a reference is missing).
        run: uv run --frozen --no-sync python update_db.py --merge

      - name: Check for changes
        id: check_changes
        run: |
          git add -A data/ arlo.db
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            MAP_DATE=$(python -c "import json,pathlib; p=pathlib.Path('data/maps/MANIFEST.json'); print(json.loads(p.read_text()).get('generated_at','')[:10] if p.is_file() else '')" 2>/dev/null || true)
            echo "map_date=$MAP_DATE" >> "$GITHUB_OUTPUT"
          fi

      - name: Open catalog pull request
        if: steps.check_changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          MAP_DATE: ${{ steps.check_changes.outputs.map_date }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # main requires a pull request, so publish on a bot branch reset from
          # main each run. This branch is not protected.
          BRANCH="chore/auto-catalog"
          git checkout -B "$BRANCH"

          # Drop legacy root-level catalog files if still present
          git rm -f --ignore-unmatch \
            items.csv items.db quests.csv quests.db \
            projects.csv projects.db traders.csv traders.db \
            missing_items.csv

          MAP_NOTE=""
          if [ -n "$MAP_DATE" ]; then
            MAP_NOTE=" maps ${MAP_DATE}"
          fi
          TITLE="Auto-update catalog [$(date -u +%Y-%m-%d)]${MAP_NOTE}"
          git commit -m "$TITLE"
          git push --force origin "HEAD:${BRANCH}"

          BODY="Weekly catalog refresh (items, quests, projects, traders, and maps). Opened by the Update Item Database workflow because main only accepts pull requests."

          STATE="$(gh pr view "$BRANCH" --json state --jq .state 2>/dev/null || true)"
          if [ "$STATE" = "OPEN" ]; then
            gh pr edit "$BRANCH" --title "$TITLE" --body "$BODY"
          else
            gh pr create --base main --head "$BRANCH" --title "$TITLE" --body "$BODY"
          fi

          # Start the required "check" status check on this commit.
          gh workflow run ci.yml --ref "$BRANCH"
          SHA="$(git rev-parse HEAD)"
          RUN_ID=""
          for _ in $(seq 1 12); do
            RUN_ID="$(gh run list --workflow ci.yml --branch "$BRANCH" --limit 20 \
              --json databaseId,headSha,event \
              --jq "[.[] | select(.headSha==\"${SHA}\" and .event==\"workflow_dispatch\")][0].databaseId")"
            if [ -n "$RUN_ID" ] && [ "$RUN_ID" != "null" ]; then
              break
            fi
            sleep 5
          done
          if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
            echo "CI did not start for ${SHA}" >&2
            exit 1
          fi
          gh run watch "$RUN_ID" --exit-status

          for _ in $(seq 1 6); do
            if gh pr merge "$BRANCH" --merge; then
              exit 0
            fi
            sleep 10
          done
          echo "Catalog pull request did not merge" >&2
          exit 1
